<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'"><title>Pulso · Tu tiempo, más claro</title>
<style>
:root{--paper:#f6f7f2;--ink:#172c29;--muted:#6c7971;--lime:#d6f97b;--line:#e1e6da;--white:#fff;--soft:#eaf0e2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #68942f;outline-offset:3px}button{border:0;color:inherit}main{max-width:980px;margin:auto;padding:24px 20px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:800;letter-spacing:-1px}.logo{width:36px;height:36px;background:var(--ink);border-radius:12px;padding:8px}.private{font-size:11px;color:var(--muted);background:var(--soft);padding:6px 10px;border-radius:20px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700;color:var(--muted)}h1{font-size:32px;line-height:1.15;letter-spacing:-1.3px;margin:9px 0}h2{font-size:19px;letter-spacing:-.5px;margin:0}h3{font-size:16px;margin:0}.subtitle{color:var(--muted);font-size:13px;margin:10px 0 22px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.periods{background:#e9edE3;border-radius:14px;padding:4px;display:flex;gap:4px;margin:20px 0}.periods button{flex:1;border-radius:11px;padding:10px 5px;background:transparent;font-size:13px}.periods .active{background:white;box-shadow:0 2px 5px #172c2910;font-weight:700}.hero{background:var(--ink);color:white;border-radius:26px;padding:25px;position:relative;overflow:hidden}.hero .eyebrow{color:#c6d3c9}.hero .time{font-size:49px;letter-spacing:-2.8px;font-weight:650;line-height:1.2;margin:10px 0}.hero .time small{font-size:23px;letter-spacing:-1px;font-weight:400}.hero .muted{color:#b7c7be;font-size:12px}.hero-line{height:6px;background:#3b5145;margin:22px 0 12px;border-radius:5px;overflow:hidden}.hero-line span{height:100%;background:var(--lime);display:block;border-radius:5px}.tag{background:#ffffff15;color:var(--lime);font-size:11px;border-radius:8px;padding:6px 9px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.stat{background:white;border:1px solid var(--line);border-radius:20px;padding:18px}.stat .number{font-size:29px;letter-spacing:-1px;font-weight:650}.stat p{font-size:12px;color:var(--muted);margin:3px 0 0}.section{margin-top:28px}.section .heading{margin-bottom:15px}.text-btn{background:transparent;font-size:12px;font-weight:700;padding:10px 0;min-height:44px}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:20px}.notice{background:#edf3df;border:1px solid #d9e5c1;border-radius:18px;padding:17px;margin:16px 0;font-size:13px}.notice p{margin:5px 0 12px}.primary,.secondary,.danger{border-radius:12px;min-height:46px;padding:12px 17px;font-weight:650;font-size:13px}.primary{background:var(--ink);color:var(--lime)}.secondary{background:var(--soft)}.danger{background:#f8e9e5;color:#913d2c}.apps{display:grid;gap:4px}.app{width:100%;display:flex;text-align:left;gap:12px;align-items:center;background:transparent;padding:13px 0;border-bottom:1px solid #eef1e9}.app:last-child{border:0}.avatar{width:42px;height:42px;flex-shrink:0;background:#edf2e5;color:#415b45;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:17px}.app:nth-child(3n+2) .avatar{background:#eeeafa;color:#71608c}.app:nth-child(3n) .avatar{background:#fcf0dc;color:#967645}.grow{flex:1;min-width:0}.app-name{font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.app-time{font-size:14px;font-weight:700;white-space:nowrap}.mini{height:4px;background:#eff2e9;border-radius:9px;margin:9px 0 5px}.mini span{display:block;height:100%;border-radius:9px;background:#759b64}.caption{color:var(--muted);font-size:11px}.bars{height:120px;display:flex;align-items:flex-end;gap:4px;padding-top:18px}.bar{flex:1;background:#dce7cf;border-radius:4px 4px 0 0;min-height:3px;min-width:0;padding:0;position:relative}.bar.peak{background:#73925d}.bar:focus{background:var(--ink)}.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:9px}.chart-detail{font-size:12px;color:var(--muted);min-height:20px;margin:12px 0 0}.insight{display:flex;gap:12px}.spark{font-size:24px;color:#769846}.insight p{margin:4px 0;color:var(--muted);font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#f9faf6f5;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 12px max(8px,env(safe-area-inset-bottom));z-index:5}.bottom button{width:110px;background:transparent;min-height:58px;color:#849083;font-size:10px;display:grid;place-content:center;gap:3px}.bottom svg{margin:auto;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7}.bottom .selected{color:var(--ink);font-weight:750;background:#eaf0e2;border-radius:14px}.empty{padding:24px 8px;text-align:center;color:var(--muted);font-size:13px}.search{background:white;border:1px solid var(--line);width:100%;padding:13px 16px;border-radius:14px;outline:none;margin-bottom:16px}.setting{padding:18px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting p{color:var(--muted);font-size:12px;margin:6px 0 12px}.status{font-size:11px;padding:4px 8px;border-radius:8px;background:var(--soft);white-space:nowrap}.foot{margin:22px 0;color:var(--muted);font-size:11px}.modal{position:fixed;inset:0;background:#11231dcc;z-index:10;display:flex;align-items:flex-end}.sheet{background:var(--paper);border-radius:26px 26px 0 0;width:100%;max-height:92dvh;overflow:auto;padding:24px 22px 40px}.close{width:44px;height:44px;border-radius:50%;background:#e7eddf;font-size:24px}.log{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}.log strong{font-size:13px}.days{display:grid;gap:13px}.day{display:grid;grid-template-columns:65px 1fr 65px;align-items:center;gap:12px;font-size:11px}.day .mini{margin:0;height:7px}.busy{opacity:.55;pointer-events:none}.error{background:#f8e9e5;color:#913d2c;border-radius:14px;padding:16px;font-size:13px}.split{display:grid;gap:0}#toast{position:fixed;bottom:95px;left:20px;right:20px;max-width:500px;margin:auto;background:var(--ink);color:white;border-radius:12px;padding:16px;z-index:20;font-size:13px}button:disabled{opacity:.5} @media(min-width:700px){main{padding-top:35px}.split{grid-template-columns:1fr 1fr;gap:24px}.split>.section{margin-top:0}.sheet{max-width:650px;margin:auto;border-radius:26px}.modal{align-items:center}.hero .time{font-size:60px}.top{margin-bottom:42px}}

.month-switch{display:flex;align-items:center;gap:10px;margin:-6px 0 18px}.month-switch button{border-radius:12px;background:var(--soft);width:44px;min-height:44px;font-size:22px}.month-switch input{min-width:0;flex:1;width:100%;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);padding:10px;font-weight:650}.comparison{margin:16px 0 22px;border:1px solid var(--line);background:white;border-radius:20px;padding:18px}.comparison .caption{margin:8px 0 0}.comparison .values{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.comparison .values strong{display:block;font-size:22px;letter-spacing:-.8px}.delta{display:inline-block;border-radius:7px;padding:3px 7px;font-size:11px;font-weight:650;background:#edf0e9;color:#697267}.delta.down{background:#e8f2df;color:#3e6c30}.delta.up{background:#fff0dc;color:#93642e}.app .delta{margin-top:6px}.day.missing{color:#90978d}.day.missing .mini{background:repeating-linear-gradient(90deg,#e1e6da 0px,#e1e6da 4px,transparent 4px,transparent 8px)}.coverage{margin:12px 0;color:var(--muted);font-size:11px}
</style></head><body><main><header class="top"><div class="brand"><svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#d6f97b" stroke-width="2.4"><path d="M1 13h5l3-8 4 15 4-10h6"/></svg>Pulso</div><span class="private">● Solo en tu teléfono</span></header><div id="screen" aria-live="polite"><div class="eyebrow">TU TIEMPO, MÁS CLARO</div><h1>Un momento para vos</h1><p class="subtitle">Preparando tus datos…</p></div></main><nav class="bottom" aria-label="Navegación principal"></nav><div id="overlay"></div><div id="toast" hidden></div>
<script>
'use strict';
const icons=['<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>','<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/>','<path d="M3 20V10m6 10V4m6 16v-7m6 7V7"/>','<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>'];
let data=null,page=0,period=0,month=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0'),query='',timer;
const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function duration(ms){let m=Math.floor(ms/60000);return m>=60?`${Math.floor(m/60)} h ${m%60} min`:m?`${m} min`:ms>0?'<1 min':'0 min'}
function clock(t){return new Date(t).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}
function date(t){return new Date(t).toLocaleDateString('es-AR',{day:'numeric',month:'short'})}
function call(name,...args){if(window.Pulso){window.Pulso[name](...args)}else toast('Esta función necesita la app Android instalada. Esta vista no mide el teléfono.')}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,4000)}
window.showError=s=>{$('#screen').classList.remove('busy');$('#screen').innerHTML=`<div class="error">${esc(s)}</div><button class="primary" onclick="reload()">Volver a intentar</button>`};
window.receive=d=>{data=d;period=d.period;month=d.month||month;$('#screen').classList.remove('busy');render()};
function reload(){if(window.Pulso){$('#screen').classList.add('busy');call('load',period,month)}else toast('Vista sin conexión a Android')}
function choose(p){period=p;query='';reload()}
function navigate(p){page=p;query='';$('#overlay').innerHTML='';render();window.scrollTo(0,0)}
function nav(){document.querySelector('nav').innerHTML=['Resumen','Aplicaciones','Hábitos','Ajustes'].map((s,i)=>`<button onclick="navigate(${i})" class="${page===i?'selected':''}" aria-current="${page===i?'page':'false'}"><svg viewBox="0 0 24 24">${icons[i]}</svg>${s}</button>`).join('')}
function periods(){return `<div class="periods" aria-label="Período">${[[0,'Hoy'],[1,'Ayer'],[7,'Semana'],[30,'Mes']].map(([p,s])=>`<button class="${p===period?'active':''}" onclick="choose(${p})" aria-pressed="${p===period}">${s}</button>`).join('')}</div>`}
function permissions(){if(data.allowed)return '';return `<div class="notice"><strong>Conectá tus estadísticas</strong><p>Activá el acceso de uso de Pulso en Ajustes para ver el tiempo real de tus aplicaciones.</p><button class="primary" onclick="call('usagePermission')">Permitir acceso de uso</button></div>`}
function chart(hours,id='chart'){let max=Math.max(...hours,1);return `<div class="bars" aria-label="Uso por hora">${hours.map((n,i)=>`<button class="bar ${n===max?'peak':''}" style="height:${Math.max(3,n/max*100)}%" aria-label="${i} horas: ${esc(duration(n))}" onclick="document.getElementById('${id}').textContent='${i}:00–${i}:59 · ${esc(duration(n))}'"></button>`).join('')}</div><div class="axis"><span>00 h</span><span>06 h</span><span>12 h</span><span>18 h</span><span>23 h</span></div><p class="chart-detail" id="${id}">Tocá una barra para ver el detalle</p>`}
function appList(apps){return apps.length?`<div class="apps">${apps.map(a=>{let ix=data.apps.indexOf(a);return `<button class="app" onclick="detail(${ix})"><span class="avatar">${esc(a.name.slice(0,1))}</span><div class="grow"><div class="row"><span class="app-name">${esc(a.name)}</span><span class="app-time">${duration(a.ms)}</span></div><div class="mini"><span style="width:${Math.min(100,a.ms/Math.max(data.total,1)*100)}%"></span></div><div class="caption">${a.sessions} sesiones · ${a.notifications} notificaciones registradas</div>${appDelta(a)}</div></button>`}).join('')}</div>`:'<p class="empty">Todavía no hay actividad disponible para este período.</p>'}
function peak(hours){let max=Math.max(...hours);return max>0?hours.indexOf(max):-1}
function render(){nav();if(!data)return;let content='';const names=['Tu día, con perspectiva','Cada app tiene su historia','Conocé tus ritmos','A tu manera'];content=`<div class="eyebrow">${page===3?'PRIVACIDAD Y CONEXIONES':'TU TIEMPO, MÁS CLARO'}</div><h1>${names[page]}</h1><p class="subtitle">${page===3?'Vos decidís qué registrar.':'Entendé cómo usás tu teléfono, sin juzgarte.'}</p>`;
if(page!==3)content+=periods()+monthPicker()+permissions()+comparison();
if(page===0){let top=data.apps.find(a=>a.ms>0);content+=`<div class="split"><div><div class="hero"><div class="row"><span class="eyebrow">USO EN APPS · ${period===0?'HOY':period===1?'AYER':period===7?'SEMANA':esc(monthName(month))}</span><span class="tag">${data.allowed?'Estimado':'Sin acceso'}</span></div><div class="time">${data.allowed&&data.recordedDays!==0?duration(data.total).replace(/h|min/g,'<small>$&</small>'):'—'}</div><div class="muted">Tiempo en primer plano · no incluye el inicio</div><div class="hero-line"><span style="width:${top?Math.round(top.ms/Math.max(1,data.total)*100):0}%"></span></div><div class="muted">${top?`${esc(top.name)} ocupa el ${Math.round(top.ms/data.total*100)}% de tu uso`:'Tus datos aparecerán al habilitar el acceso'}</div></div><div class="stats"><div class="stat"><div class="eyebrow">SESIONES</div><div class="number">${data.allowed&&data.recordedDays!==0?data.sessions:'—'}</div><p>Visitas estimadas a apps</p></div><div class="stat"><div class="eyebrow">NOTIFICACIONES</div><div class="number">${data.since?data.notifications:'—'}</div><p>${data.notificationsAllowed?'Registradas por Pulso':'Acceso desactivado'}</p></div></div></div><section class="section"><div class="row heading"><h2>Dónde va tu tiempo</h2><button class="text-btn" onclick="navigate(1)">Ver todas ↗</button></div><div class="card">${appList(data.apps.filter(a=>a.ms>0).slice(0,4))}</div></section></div><section class="section"><div class="row heading"><h2>Tu actividad por hora</h2><button class="text-btn" onclick="reload()">↻ Actualizar</button></div><div class="card">${chart(data.hours)}</div></section>`;let h=peak(data.hours);if(h>=0)content+=`<section class="section card insight"><span class="spark">✳</span><div><h3>Tu hora más activa: ${h}:00–${h}:59</h3><p>Acumulaste ${duration(data.hours[h])} en esa franja${period===7?' durante la semana seleccionada':period===30?' durante el mes seleccionado':''}. Podés explorar cada app en Hábitos.</p></div></section>`;}
if(page===1)content+=`<input class="search" aria-label="Buscar aplicación" placeholder="Buscar una aplicación…" oninput="filterApps(this.value)"><div class="card" id="app-results">${appList(data.apps)}</div>`;
if(page===2){content+=`<div class="stats"><div class="stat"><div class="eyebrow">SESIÓN MEDIA</div><div class="number">${duration(data.sessions?data.total/data.sessions:0)}</div><p>Tiempo por visita</p></div><div class="stat"><div class="eyebrow">LA MÁS LARGA</div><div class="number">${duration(data.longest)}</div><p>Sesión del período</p></div></div><section class="section"><h2 class="heading">Uso por día</h2><div class="card days">${data.days.map(d=>`<div class="day ${d.ms===null?'missing':''}"><span>${date(d.date+'T12:00:00')}</span><div class="mini"><span style="width:${(d.ms||0)/Math.max(...data.days.map(x=>x.ms||0),1)*100}%"></span></div><strong>${d.ms===null?'Sin datos':duration(d.ms)}</strong></div>`).join('')}</div></section><section class="section"><h2 class="heading">En qué horarios entrás</h2><div class="card">${openingChart()}</div></section><section class="section"><h2 class="heading">Notificaciones por hora</h2><div class="card">${notificationChart()}</div></section><section class="section"><h2 class="heading">Últimas sesiones</h2><div class="card">${logs(data.timeline.slice(0,40))}</div><p class="caption">Mostramos hasta 40 sesiones recientes. Los totales incluyen todas las disponibles.</p></section>`;}
if(page===3)content+=`<div class="card"><div class="setting"><div class="row"><h3>Conectar con LifeOS</h3><span class="status">${data.cloud?.linked?'Vinculado':'Sin vincular'}</span></div><p>Consultá tus estadísticas del teléfono junto a tus proyectos y registros personales. La sincronización es opcional y conserva el historial local.</p>${data.cloud?.last?`<p>Último envío: ${date(data.cloud.last)} a las ${clock(data.cloud.last)}</p>`:''}${data.cloud?.error?`<p role="status">${esc(data.cloud.error)}</p>`:''}${data.cloud?.linked?`<button class="primary" onclick="call('syncNow')">Sincronizar ahora</button> <button class="secondary" onclick="call('disconnectCloud')">Desconectar</button>`:`<button class="primary" onclick="call('connectCloud')">Vincular mi cuenta</button>`}</div></div><div class="card"><div class="setting"><div class="row"><h3>Estadísticas de uso</h3><span class="status">${data.allowed?'Activo':'Sin permiso'}</span></div><p>Permite consultar qué aplicaciones usás y durante cuánto tiempo.</p><button class="secondary" onclick="call('usagePermission')">Gestionar acceso de uso</button></div><div class="setting"><div class="row"><h3>Contar notificaciones</h3><span class="status">${data.notificationsAllowed?'Activo':'Desactivado'}</span></div><p>Android concede acceso a las notificaciones. Pulso guarda solamente la aplicación y la hora: no guarda títulos ni mensajes. Se excluyen avisos permanentes, resúmenes de grupos y actualizaciones de un mismo aviso.</p><button class="secondary" onclick="call('notificationPermission')">Gestionar acceso a notificaciones</button></div><div class="setting"><h3>Pulso en tu pantalla de inicio</h3><p>Un widget con el uso del día y tus sesiones. Se actualiza aproximadamente cada 30 minutos, al abrir el resumen o al tocar Actualizar.</p><button class="primary" onclick="call('widget')">Añadir widget</button></div><div class="setting"><h3>Tus datos quedan con vos</h3><p>Sin anuncios. Tus datos se guardan en el teléfono. Si vinculás LifeOS, se envían resúmenes diarios por conexión cifrada a tu cuenta; podés desconectarlo cuando quieras. Los envíos incluyen aplicaciones y tiempos, sesiones, distribución horaria y conteos de notificaciones; no incluyen mensajes ni la lista de sesiones individuales. Los conteos de notificaciones se conservan hasta 90 días. El historial de uso se guarda por hasta 24 meses en este dispositivo. Se actualiza al abrir Pulso y mediante una tarea aproximada cada 6 horas; Android puede demorarla. ${data.since?'Registro iniciado: '+date(data.since)+' a las '+clock(data.since)+'.':''} Si desactivás el acceso o Android detiene el servicio, habrá períodos sin registrar.</p><button class="danger" onclick="call('clear')">Borrar conteos de notificaciones</button></div></div><div class="notice"><strong>Sobre la precisión</strong><p>Las sesiones se reconstruyen con eventos de Android. Pantalla dividida, eventos faltantes o cambios de actividad pueden afectar el resultado. “Uso en apps” no equivale al tiempo total de pantalla.</p><p>Pulso recupera los eventos que Android todavía conserva y guarda resúmenes diarios. Los días sin historial aparecen como “Sin datos”. No se inventan meses anteriores. Las comparaciones usan días completos y el mismo número de días; no incluyen hoy. Un mes puede tener datos parciales. Los avisos de mensajes agrupados no equivalen a mensajes individuales.</p></div><p class="foot">Pulso 0.3 · Conexión opcional con LifeOS<br>Widget incluido · ventana flotante pendiente</p>`;
if(page!==3)content+=`<p class="foot">Actualizado ${clock(data.updated)} · Sesiones y tiempos estimados<br>${period===7?'Semana: los últimos 7 días completos, sin incluir hoy.':period===30?'Mes calendario; el total incluye hoy si es el mes en curso.':'El tiempo de uso depende de los eventos disponibles en Android.'}<br>${data.recordedDays??0} de ${data.expectedDays??1} días con registros · ${data.completeDays??0} completos${data.since?'<br>Notificaciones registradas desde '+date(data.since)+'.':''}</p>`;
$('#screen').innerHTML=content;
}
function monthName(value){return new Date(value+'-15T12:00:00').toLocaleDateString('es-AR',{month:'long',year:'numeric'})}
function monthPicker(){if(period!==30)return '';return `<div class="month-switch"><button onclick="shiftMonth(-1)" aria-label="Mes anterior" ${month<=(data.monthMin||'2000-01')?'disabled':''}>‹</button><input type="month" aria-label="Seleccionar mes" value="${esc(month)}" min="${esc(data.monthMin||'2000-01')}" max="${esc(data.monthMax||month)}" onchange="selectMonth(this.value)"><button onclick="shiftMonth(1)" aria-label="Mes siguiente" ${month>=(data.monthMax||month)?'disabled':''}>›</button></div>`}
function selectMonth(value){if(!/^\d{4}-\d{2}$/.test(value))return;month=value;reload()}
function shiftMonth(step){let d=new Date(month+'-15T12:00:00');d.setMonth(d.getMonth()+step);selectMonth(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
function rangeLabel(from,until){let end=new Date(until+'T12:00:00');end.setDate(end.getDate()-1);return date(from+'T12:00:00')+'–'+date(end)}
function deltaText(current,previous){if(previous===0)return current===0?'Sin cambios':'Sin uso anterior';let pct=(current-previous)*100/previous;return (pct>0?'↑ ':pct<0?'↓ ':'')+Math.abs(pct).toLocaleString('es-AR',{maximumFractionDigits:1})+'%'}
function deltaClass(current,previous){return current>previous?'up':current<previous?'down':''}
function comparison(){const c=data.comparison;if(!c)return '';if(period===0)return '<p class="coverage">Elegí Semana o Mes para comparar con el período anterior.</p>';if(!c.available)return `<section class="comparison"><h3>${period===30?'Comparación mensual':period===7?'Comparación semanal':'Comparación diaria'}</h3><p class="caption">${c.days===0?'La comparación estará disponible cuando haya días completos.':'Todavía no hay historial completo para comparar estos períodos.'}</p>${c.days?`<p class="caption">${rangeLabel(c.from,c.until)}: ${c.currentDays}/${c.days} días completos<br>${rangeLabel(c.previousFrom,c.previousUntil)}: ${c.previousDays}/${c.days} días completos</p>`:''}<p class="caption">Los registros disponibles se muestran abajo. Los días faltantes no cuentan como cero uso.</p></section>`;return `<section class="comparison"><div class="row"><h3>${period===30?'Frente al mes anterior':period===7?'Frente a la semana anterior':'Frente al día anterior'}</h3><span class="delta ${deltaClass(c.current,c.previous)}">${deltaText(c.current,c.previous)}</span></div><div class="values"><div><span class="caption">${rangeLabel(c.from,c.until)}</span><strong>${duration(c.current)}</strong></div><div><span class="caption">${rangeLabel(c.previousFrom,c.previousUntil)}</span><strong>${duration(c.previous)}</strong></div></div><p class="caption">${c.days} días completos en cada período${period===30?' · hoy queda fuera de esta comparación':''}</p></section>`}
function appDelta(a){const c=data.comparison;if(!c||period===0)return '';return c.available?`<span class="delta ${deltaClass(a.comparisonCurrent,a.previous)}">${deltaText(a.comparisonCurrent,a.previous)} vs. ${period===30?'mes':period===7?'semana':'día'} anterior</span>`:'<span class="caption">Comparación pendiente: falta historial</span>'}
function appComparison(a){const c=data.comparison;if(!c||period===0)return '';if(!c.available)return '<div class="notice">Todavía no hay suficientes días completos para calcular el aumento o la disminución de esta app.</div>';return `<section class="comparison"><div class="row"><h3>Evolución de uso</h3>${appDelta(a)}</div><div class="values"><div><span class="caption">${rangeLabel(c.from,c.until)}</span><strong>${duration(a.comparisonCurrent)}</strong></div><div><span class="caption">${rangeLabel(c.previousFrom,c.previousUntil)}</span><strong>${duration(a.previous)}</strong></div></div><p class="caption">Mismo número de días completos · ${a.comparisonCurrent>=a.previous?'+':'−'}${duration(Math.abs(a.comparisonCurrent-a.previous))}</p></section>`}
function openingChart(){let max=Math.max(...data.opens,1);return `<div class="bars">${data.opens.map((n,i)=>`<button class="bar ${n===max?'peak':''}" style="height:${Math.max(3,n/max*100)}%" aria-label="${i} horas, ${n} sesiones" onclick="document.getElementById('opens-detail').textContent='${i}:00–${i}:59 · ${n} sesiones estimadas'"></button>`).join('')}</div><div class="axis"><span>00 h</span><span>06 h</span><span>12 h</span><span>18 h</span><span>23 h</span></div><p class="chart-detail" id="opens-detail">Tocá una barra para ver las sesiones</p>`}
function notificationChart(){let values=data.notificationHours||Array(24).fill(0),max=Math.max(...values,1);return `<div class="bars">${values.map((n,i)=>`<button class="bar ${n===max?'peak':''}" style="height:${Math.max(3,n/max*100)}%" aria-label="${i} horas, ${n} notificaciones" onclick="document.getElementById('notifications-detail').textContent='${i}:00–${i}:59 · ${n} notificaciones registradas'"></button>`).join('')}</div><div class="axis"><span>00 h</span><span>06 h</span><span>12 h</span><span>18 h</span><span>23 h</span></div><p class="chart-detail" id="notifications-detail">${data.since?'Tocá una barra para ver el detalle':'Activá el acceso en Ajustes para empezar a registrar'}</p>`}
function filterApps(s){query=s;$('#app-results').innerHTML=appList(data.apps.filter(a=>a.name.toLocaleLowerCase().includes(s.toLocaleLowerCase())))}
function logs(list){return list.length?list.map(s=>`<div class="log"><div class="grow"><strong>${esc(s.name)}</strong><div class="caption">${date(s.start)} · ${clock(s.start)}–${clock(s.end)}</div></div><span class="caption">${duration(s.end-s.start)}</span></div>`).join(''):'<p class="empty">No hay sesiones disponibles.</p>'}
function detail(i){let a=data.apps[i];if(!a)return;$('#overlay').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Detalle de ${esc(a.name)}"><section class="sheet"><div class="row"><div><div class="eyebrow">DETALLE DE APLICACIÓN</div><h2>${esc(a.name)}</h2></div><button class="close" onclick="closeDetail()" aria-label="Cerrar detalle">×</button></div><div class="stats"><div class="stat"><div class="number">${duration(a.ms)}</div><p>${a.sessions} sesiones estimadas</p></div><div class="stat"><div class="number">${a.notifications}</div><p>Notificaciones registradas</p></div></div>${appComparison(a)}<section class="section"><h3>Cuándo la usás</h3>${chart(a.hours,'detail-chart')}</section><div class="notice">Sesión media: <strong>${duration(a.sessions?a.ms/a.sessions:0)}</strong><br>Sesión más larga: <strong>${duration(a.longest)}</strong></div><h3>Sesiones recientes</h3>${logs(data.timeline.filter(s=>s.app===a.id).slice(0,30))}<p class="foot">Detalle limitado a las sesiones presentes entre las últimas 200 del período.</p></section></div>`;$('.close').focus()}
function closeDetail(){$('#overlay').innerHTML=''}
window.back=()=>{if($('#overlay').innerHTML)closeDetail();else if(page!==0)navigate(0);else call('exit')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});
nav();if(!window.Pulso){$('#screen').innerHTML='<div class="eyebrow">PULSO PARA ANDROID</div><h1>Tu tiempo, más claro</h1><div class="notice"><strong>Instalá la app para empezar</strong><p>Esta pantalla web no puede consultar el uso del celular. El instalador Android conecta el panel con tus estadísticas reales.</p></div>'}
</script></body></html>
